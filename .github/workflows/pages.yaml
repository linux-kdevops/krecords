# SPDX-License-Identifier: copyleft-next-0.3.1
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A deploy that started finishes; a newer push waits for it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: records
          # The site dates each commit's records by the last commit of
          # this repository that touched them.
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: linux-kdevops/kresults
          path: kresults
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install jsonschema
      - run: python kresults/format/validate.py --records records
      - id: pages
        uses: actions/configure-pages@v6
      - run: >-
          python kresults/format/render.py --records records --output site
          --revision "$(git -C kresults rev-parse --short=12 HEAD)"
          --url "${{ steps.pages.outputs.base_url }}"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
